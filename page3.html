<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Directory ของหัวข้อกฎหมาย</title>
    <style>
        /* ตั้งค่าพื้นหลังและระยะห่างของเมนู */
        body {
            font-family: Arial, sans-serif; /* ตั้งค่าฟอนต์ */
            padding: 20px; /* ระยะห่างจากขอบ */
            background: #f4f4f4; /* สีพื้นหลัง */
        }
        nav {
            background: #fff; /* สีพื้นหลังของเมนู */
            border: 1px solid #ccc; /* ขอบของเมนู */
            padding: 10px; /* ระยะห่างภายในเมนู */
        }
        nav a {
            text-decoration: none; /* ยกเลิกเส้นใต้ข้อความ */
            color: #000; /* สีข้อความ */
            display: block; /* ให้ลิงก์เป็นบล็อค */
            padding: 8px; /* ระยะห่างรอบข้อความ */
            margin: 5px 0; /* ระยะห่างระหว่างลิงก์ */
        }
        nav a:hover {
            background: #e9e9e9; /* สีพื้นหลังเมื่อเมาส์อยู่เหนือ */
        }
    </style>
</head>
<body>

        <a href="#ทางจำเป็น">ทางจำเป็น</a>

    </nav>
</body>
</html>
